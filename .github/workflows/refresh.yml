name: Refresh events

# Re-scrapes OFO's events page daily and commits the result. Pages serves main
# from the repo root, so the commit is the deploy.

on:
  schedule:
    # 11:17 UTC — early morning in Ontario. Off the hour, because GitHub delays
    # scheduled runs most at the top of one.
    - cron: "17 11 * * *"
  workflow_dispatch:

permissions:
  contents: write
  issues: write  # a new trip opens an issue, which emails the owner

concurrency:
  group: refresh-events
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Scrape
        run: python3 scrape.py > events.new.json

      - name: Check the scrape before trusting it
        run: python3 check.py events.new.json events.json

      - name: Find new trips
        run: python3 announce.py events.json events.new.json > new-trips.md

      - name: Geocode
        run: |
          mv events.new.json events.json
          python3 geocode.py

      - name: Commit if the data moved
        run: |
          if git diff --quiet -- events.json cache.json; then
            echo "No change since the last run."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add events.json cache.json
          git commit -m "Refresh events data ($(date -u +%Y-%m-%d))"
          git push

      # Only after the push, so a failed refresh never announces anything.
      - name: Open an issue for new trips
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [ -s new-trips.md ] || exit 0
          n=$(grep -c '^- ' new-trips.md)
          { cat new-trips.md; echo; echo "Map: https://dk1.github.io/ofo-events-map/"; } > body.md
          gh issue create --title "$n new OFO trip(s) — $(date -u +%Y-%m-%d)" --body-file body.md
